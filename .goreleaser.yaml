# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# One binary, basalt. All release binaries are CGO_ENABLED=0 static builds.
# Reproducible builds: every timestamp that lands in an artifact (binary
# mtime, archive entries, package entries) is the commit time of the commit
# being built, not the time the build ran. With -trimpath, the same commit
# and Go toolchain give the same bytes and the same SHA256SUMS on any machine.
# SOURCE_DATE_EPOCH is set to the same commit time for the builds.
# Version tags are created manually (see docs/RELEASING.md). CI never
# creates or pushes git tags. Branch/PR builds use --snapshot (no GitHub
# Release, no registry publish).
project_name: basaltdb

builds:
  - id: basalt
    main: ./cmd/basalt
    binary: basalt
    env:
      - CGO_ENABLED=0
      - SOURCE_DATE_EPOCH={{ .CommitTimestamp }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/basaltdbhq/basaltdb/internal/buildinfo.Version={{.Env.BASALT_VERSION}}

archives:
  - formats: [tar.gz]
    # Flat archives so install.sh can copy binaries from the extract root.
    wrap_in_directory: false
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

nfpms:
  - id: linux-packages
    ids: [basalt]
    package_name: basaltdb
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    maintainer: Iman Tumorang <iman@tumorang.com>
    description: |-
      The action ledger for AI agents on your Postgres. Not a database.
      Open source under Apache-2.0.
    license: Apache-2.0
    formats: [deb, rpm, apk]
    mtime: "{{ .CommitDate }}"
    bindir: /usr/bin
    section: database
    contents:
      - src: LICENSE
        dst: /usr/share/doc/basaltdb/LICENSE
        file_info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/basaltdb/README.md
        file_info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  disable: true

# Snapshot archive names (CI Actions artifacts only). CI never tags
# and never publishes these to GitHub Releases.
snapshot:
  version_template: "0.0.0-nightly"

# The formula is uploaded only on v* tags and only when PUBLISH_HOMEBREW is
# "true" (the release workflow sets it from the repository variable of the same
# name, default off). Unset or anything else means no upload and no tap token
# needed. Default tap is BasaltDBHq/homebrew-tap (install: brew install basaltdbhq/tap/basaltdb).
brews:
  - name: basaltdb
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    description: The action ledger for AI agents on your Postgres
    license: Apache-2.0
    directory: Formula
    repository:
      owner: '{{ or (envOrDefault "HOMEBREW_TAP_OWNER" "") "BasaltDBHq" }}'
      name: '{{ or (envOrDefault "HOMEBREW_TAP_NAME" "") "homebrew-tap" }}'
      # The token field accepts only a single {{ .Env.NAME }}, no functions.
      # The release workflow always sets the variable, empty when Homebrew is off.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    install: |
      bin.install "basalt"
    skip_upload: '{{ or (ne (envOrDefault "RELEASE_KIND" "") "tag") (ne (envOrDefault "PUBLISH_HOMEBREW" "") "true") }}'

release:
  name_template: "{{ .Tag }}"
  # Semver prerelease suffix (-alpha / -beta / -rc) → GitHub prerelease.
  prerelease: auto
  mode: replace
  # The portal manifest the release's pages were built from, so a person can
  # run basalt portal verify --manifest portal.sha256 against it.
  extra_files:
    - glob: web/portal.sha256
      name_template: portal.sha256

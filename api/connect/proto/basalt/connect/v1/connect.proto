// The connect service's API (CONTRACT.md, Connect). The connect service is
// a hosted service of Basalt Vault, used only at setup: it runs a bot's
// setup code against the person's database, once, and writes nothing
// anywhere. For a connect-only setup code it holds the database's address
// (never the password) in memory for up to 30 minutes, until the bot's
// engine collects it. Planned: no part of BasaltDB serves or calls it yet.
//
// Field names are snake_case here; the proto3 JSON names, which the connect
// page sends and reads, are their camelCase forms. Byte values are strings
// of base64url without padding, and enum values are SCREAMING_SNAKE_CASE
// strings, as in the rest of the contract. Integer fields are 32-bit, so
// proto3 JSON writes them as numbers. Proto3 JSON leaves out a field at its
// default value: an absent field is false, 0, empty or an empty list.
syntax = "proto3";

package basalt.connect.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/basaltdbhq/basaltdb/api/connect/proto/basalt/connect/v1;connectv1";

extend google.protobuf.FieldOptions {
  // A field whose value must stay out of logs: the admin connection string,
  // and the hand-off ticket, which carries the database's address. Nothing
  // may write it to a log, a trace, an error report or a metric label.
  // The number is from the in-house range; a program that also links another
  // extension of FieldOptions with this number would not start.
  bool sensitive = 51873;
}

// Runs a bot's setup code against the person's database, once.
service SetupService {
  // What the code asks for, in words, and a passkey challenge. No database
  // access.
  rpc DescribeSetup(DescribeSetupRequest) returns (DescribeSetupResponse);
  // Connects, reads the database's state, and returns the questions to ask.
  // Changes nothing.
  rpc CheckSetup(CheckSetupRequest) returns (CheckSetupResponse);
  // Connects and runs the setup in one transaction. For a connect-only
  // code, then holds the database's address and returns a hand-off ticket.
  rpc RunSetup(RunSetupRequest) returns (RunSetupResponse);
  // The engine: the address of its connect-only setup, signed with the
  // engine key the setup code names. No database access.
  rpc CollectAddress(CollectAddressRequest) returns (CollectAddressResponse);
  // The page: whether the engine has collected the address. No database
  // access.
  rpc HandoffStatus(HandoffStatusRequest) returns (HandoffStatusResponse);
  // The page: puts a hold the service lost (a restart) back, with the
  // ticket's own expiry. No database access.
  rpc OfferAddress(OfferAddressRequest) returns (OfferAddressResponse);
}

message DescribeSetupRequest {
  // The setup code, basalt-setup.1.<payload>.<check>.
  string code = 1;
}

message DescribeSetupResponse {
  SetupSummary summary = 1;
  PasskeyChallenge challenge = 2;
}

// What the setup code asks for, decoded and checked.
message SetupSummary {
  string setup_id = 1;
  // INSTALL, AGENT or UPGRADE.
  string kind = 2;
  // The agent's name; empty for UPGRADE.
  string agent = 3;
  // <prefix>_agent_<name>; empty for UPGRADE.
  string role = 4;
  string prefix = 5;
  // Absent for a connect-only code: the database is the one the person
  // pastes.
  Target target = 6;
  repeated string write = 7;
  repeated string read = 8;
  int32 statement_timeout_ms = 9;
  int32 guard_from = 10;
  int32 guard_to = 11;
  // RFC 3339 UTC.
  string expires_at = 12;
  // The setup fingerprint, five groups of four lowercase hex digits.
  string fingerprint = 13;
  // The engine's fingerprint, when the code carries an engine key.
  string engine_fingerprint = 14;
  // The summary lines that do not depend on the database, in the words
  // basalt init --setup-code shows.
  repeated string lines = 15;
  // The schemas of agent.allTables (public only); empty when the code
  // names its tables in write and read.
  repeated string all_tables_schemas = 16;
}

// The database the setup code is for.
message Target {
  string host = 1;
  int32 port = 2;
  string database = 3;
  // Set when the code names a Supabase project.
  string supabase_ref = 4;
}

// A passkey registration challenge. The page passes it to the browser to
// create a passkey and sends it back unchanged with RunSetup.
message PasskeyChallenge {
  // 32 random bytes.
  string challenge = 1;
  // 16 random bytes: the WebAuthn user id.
  string user_id = 2;
  // Labels for the passkey picker.
  string user_name = 3;
  string display_name = 4;
  // RFC 3339 UTC, 15 minutes after DescribeSetup.
  string expires_at = 5;
  // The service's keyed hash binding the fields above to the code's
  // fingerprint. Opaque to the page.
  string mac = 6;
}

message CheckSetupRequest {
  string code = 1;
  // The admin connection string the person pasted.
  string database_url = 2 [(sensitive) = true];
}

message CheckSetupResponse {
  // Asked before Approve; RunSetup needs an answer to each.
  repeated Question questions = 1;
  // True when RunSetup needs a passkey registration.
  bool passkey_needed = 2;
  // Lines that depend on the database's state, in the words
  // basalt init --setup-code shows.
  repeated string notes = 3;
  // True for an UPGRADE code with nothing to do: RunSetup then changes and
  // records nothing.
  bool nothing_to_do = 4;
  // The database the pasted string names, which the page shows first under
  // Before you approve.
  Target database = 5;
  // With agent.allTables: the tables the agent will get, schema.table, in
  // order. Empty when the code names its tables.
  repeated string tables = 6;
  // With agent.allTables: the tables in those schemas left out, because
  // the admin role does not own them.
  repeated ExcludedTable excluded = 7;
}

message ExcludedTable {
  // schema.table.
  string table = 1;
  // The role that owns it.
  string owner = 2;
}

message Question {
  // ROW_LEVEL_SECURITY.
  string kind = 1;
  // schema.table.
  string table = 2;
  // The question, in the words basalt init --setup-code asks it.
  string text = 3;
  // The answers allowed: ALL_ROWS or NONE.
  repeated string choices = 4;
}

message Answer {
  string kind = 1;
  string table = 2;
  string choice = 3;
}

message RunSetupRequest {
  string code = 1;
  // The admin connection string the person pasted.
  string database_url = 2 [(sensitive) = true];
  repeated Answer answers = 3;
  // The challenge DescribeSetup returned, unchanged. Required with passkey.
  PasskeyChallenge challenge = 4;
  // Absent when no passkey is needed.
  PasskeyRegistration passkey = 5;
}

// The browser's answer to navigator.credentials.create, as in the passkey
// registration response (CONTRACT.md, Approvals, Codes).
message PasskeyRegistration {
  string credential_id = 1;
  string client_data_json = 2;
  string authenticator_data = 3;
  // SubjectPublicKeyInfo DER from getPublicKey().
  string public_key = 4;
  // -7 (ES256) only.
  int32 public_key_algorithm = 5;
  bool prf_supported = 6;
  // The passkey's label; empty for the default basalt init uses.
  string label = 7;
}

message RunSetupResponse {
  repeated string warnings = 1;
  // The passkeys this run registered.
  repeated RegisteredPasskey passkeys = 2;
  // As in CheckSetupResponse.
  bool nothing_to_do = 3;
  // Connect-only codes only: the hand-off ticket the page passes to
  // HandoffStatus and OfferAddress. Opaque to the page; kept in memory only.
  string ticket = 4 [(sensitive) = true];
  // Connect-only codes only: true when the database already recorded this
  // setup and nothing changed; the address is held again for the engine.
  bool reconnected = 5;
}

message RegisteredPasskey {
  string credential_id = 1;
  string label = 2;
  // The passkey check code (CONTRACT.md, Connect).
  string check_code = 3;
}

message CollectAddressRequest {
  // The setupId of the connect-only setup code.
  string setup_id = 1;
  // The engine's signing key, as the code's engine.publicKey: SPKI DER,
  // base64url without padding.
  string engine_public_key = 2;
  // RFC 3339 UTC, whole seconds: when the engine signed.
  string time = 3;
  // ECDSA P-256 over the basalt-connect-collect.1 context (CONTRACT.md,
  // Connect, The address hand-off), 64 bytes r and s, base64url.
  string signature = 4;
}

message CollectAddressResponse {
  // The database the setup ran in. Never a password.
  Target address = 1;
}

message HandoffStatusRequest {
  string ticket = 1 [(sensitive) = true];
}

message HandoffStatusResponse {
  // HELD, COLLECTED or UNKNOWN (no hold: the service restarted or the hold
  // expired).
  string state = 1;
  // COLLECTED: RFC 3339 UTC, when the engine first collected.
  string collected_at = 2;
  // HELD and COLLECTED: a new ticket that records the state, for the page
  // to use from now on.
  string ticket = 3 [(sensitive) = true];
}

message OfferAddressRequest {
  string ticket = 1 [(sensitive) = true];
}

message OfferAddressResponse {
  // HELD or COLLECTED, as the ticket records it.
  string state = 1;
}

// The error detail of every refusal, attached to the ConnectRPC error.
message Refusal {
  // SCREAMING_SNAKE_CASE, from the refusals table in CONTRACT.md, Connect.
  string reason = 1;
  // The fixed message, in the words the laptop command uses. Never holds
  // the connection string.
  string message = 2;
  // Set when trying again later can work.
  int32 retry_after_seconds = 3;
}

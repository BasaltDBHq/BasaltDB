version: "2"

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/basaltdbhq/basaltdb

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - grouper
    - importas
    - loggercheck
    - makezero
    - mirror
    - mnd
    - misspell
    - nilerr
    - nilnil
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  exclusions:
    warn-unused: true
    paths:
      - bin
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - goconst
          - wrapcheck
          - err113
          - revive
          - testifylint
          - errcheck
          - forbidigo

      - path: internal/lib/uniqueid/
        linters:
          - forbidigo

      - path: cmd/
        linters:
          - gochecknoinits
          - wrapcheck
          - revive
          - errcheck
          - goconst
          - gosec
          - errchkjson
          - gocritic

      - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"
        linters:
          - errcheck

      - text: "G104:"
        linters:
          - gosec

  disable:
    - gocyclo
    - gochecknoglobals
    - exhaustruct
    - varnamelen
    - nlreturn
    - testpackage
    - paralleltest
    - funlen
    - cyclop
    - godox
    - nonamedreturns
    - testifylint
    - thelper
    - wrapcheck
    - godot
    - err113
    - noctx
    - ireturn
    - nakedret
    - perfsprint
    - gochecknoinits
    - gocognit

  settings:
    depguard:
      rules:
        # Test helper packages (fakes, fixtures and the core test oracles) are
        # linked into test binaries only. TestArchitecture in
        # internal/testkit/archtest fails a non-test file that imports one; it
        # finds them by name (<x>test, internal/testkit), so there is no list
        # to keep here.
        # Tests use testify/require (AGENTS.md): a failed check stops the test.
        require-not-assert:
          deny:
            - pkg: github.com/stretchr/testify/assert
              desc: use github.com/stretchr/testify/require
        # The Go plugin SDK is its own module, with its own generated copy of
        # the plugin service. Only the programs that are plugins import it: a
        # binary that also links the engine's copy would not start.
        plugin-sdk-only-in-plugins:
          files:
            - "!**/internal/plugin/out/plugintransport/testnotifier/cmd/**"
            - "!**/scripts/systemd-smoke/probe/**"
          deny:
            - pkg: github.com/basaltdbhq/basalt-plugin-go
              desc: only the test notifier and the systemd smoke probe import the plugin SDK
        # The agent service, its MCP tools and the agent service's code in
        # internal/app (agent_*.go) talk to the store only through the store
        # ports (internal/agent: the StoreSet; app: Store, SQLStore): no
        # database driver, SQL policy or adapter in them. The rest of
        # internal/app, which wires the adapters, is outside it.
        agent-through-store-ports:
          files:
            - "**/internal/agent/**"
            - "**/internal/app/agent_*.go"
            - "!$test"
          deny:
            - pkg: github.com/jackc/pgx
              desc: the agent service reaches Postgres only through the store ports
            - pkg: github.com/basaltdbhq/basaltdb/internal/core/sqlguard
              desc: statements are checked by the store (SQLStore.Check)
            - pkg: github.com/basaltdbhq/basaltdb/internal/platform/postgres/store
              desc: the run.go wiring picks the adapter; the service sees ports only
            - pkg: github.com/basaltdbhq/basaltdb/internal/platform/postgres/pgdial
              desc: the agent service opens no connection
        # The ledger, the signed-message codecs and the PII code do not depend
        # on a store adapter or on the agent service. The agent service's
        # wiring now lives in internal/app, which none of them can import
        # (that would be an import cycle).
        no-adapter-in-ledger-and-pii:
          files:
            - "**/internal/platform/postgres/ledger/**"
            - "**/internal/core/approval/**"
            - "**/internal/core/revert/**"
            - "**/internal/core/pii/**"
            - "**/internal/pii/**"
            - "!$test"
          deny:
            - pkg: github.com/basaltdbhq/basaltdb/internal/platform/postgres/store
              desc: the ledger and PII code do not depend on a store adapter
            - pkg: github.com/basaltdbhq/basaltdb/internal/agent
              desc: the ledger and PII code do not depend on the agent service
        # internal/core/action is the store-neutral vocabulary: the standard
        # library, uuid, pagination and the large-value rules only.
        action-is-neutral:
          files:
            - "**/internal/core/action/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/basaltdbhq/basaltdb/internal/lib/pagination
            - github.com/basaltdbhq/basaltdb/internal/core/largevalue
        # The approval's and the revert's store port types are store-neutral
        # too: the standard library, uuid, the action types and the
        # signed-message codecs only.
        store-port-types-are-neutral:
          files:
            - "**/internal/core/approvalstore/**"
            - "**/internal/core/revertstore/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/basaltdbhq/basaltdb/internal/core/action
            - github.com/basaltdbhq/basaltdb/internal/core/approval
            - github.com/basaltdbhq/basaltdb/internal/core/passkey
            - github.com/basaltdbhq/basaltdb/internal/core/revert
        # The signed-message codecs sit below the store port types and the
        # action types. core/action no longer imports them, so the compiler
        # no longer refuses the reverse import: this rule does.
        codecs-below-action:
          files:
            - "**/internal/core/approval/**"
            - "**/internal/core/passkey/**"
            - "**/internal/core/revert/**"
          deny:
            - pkg: github.com/basaltdbhq/basaltdb/internal/core/action
              desc: the signed-message codecs sit below the action types; they must not import them
    # Every id BasaltDB generates is a UUIDv7 from internal/lib/uniqueid.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^uuid\.New
          pkg: ^github\.com/google/uuid$
          msg: generate ids with internal/lib/uniqueid
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    dupl:
      threshold: 100

    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-tests: true

    misspell:
      locale: US
      ignore-rules:
        - cancelled

    mnd:
      # go-mnd defaults already ignore 0, 1, 0.0, 1.0, _test.go, and strconv/time formatters.
      checks:
        - argument
        - assign
        - case
        - condition
        - operation
        - return
      ignored-numbers:
        - "2"
      ignored-functions:
        - "math.*"
        - "sort.*"
        - "bytes.*"
        - "strings.*"
        - "fmt.*"
        - "rand.*"
        - "regexp.*"
        - "strconv.*"
        - "time.*"
        - "make"
        - "http.StatusText"
        - "json.Encoder.SetEscapeHTML"

    nakedret:
      max-func-lines: 0

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    revive:
      enable-all-rules: false
      rules:
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
          arguments:
            - ["ID", "URL", "HTTP", "JSON", "API", "DB", "SQL"]
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: if-return
        - name: early-return

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - exitAfterDefer
        - commentFormatting
        - sloppyReassign

    gosec:
      excludes:
        - G404
        - G304
        - G111
        - G115
        - G301
        - G302
        - G402
        - G703
        - G704
        - G204
        - G202

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    exhaustive:
      check:
        - switch
        - mapliteral
      default-signifies-exhaustive: true




issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true
  sort-order:
    - linter
    - severity
    - file
  show-stats: true

run:
  timeout: 5m
  relative-path-mode: gomod
  issues-exit-code: 1
  tests: true
  build-tags:
    - integration
  modules-download-mode: readonly
  allow-parallel-runners: false
  go: "1.26"
  concurrency: 4

severity:
  default: error
  rules:
    - linters:
        - errcheck
        - gosec
        - govet
        - staticcheck
      severity: error

    - linters:
        - dupl
        - goconst
        - mnd
        - misspell
      severity: warning

    - linters:
        - godot
        - whitespace
      severity: info

// The ConnectRPC mapping of the plugin protocol's platform messages
// (CONTRACT.md, Plugins, Protocol). Each message here has the same fields
// as its JSON schema under api/plugin/protocol/, in snake_case; the proto3
// JSON names are the schema's camelCase names. Each hook's messages are
// added to this package by that hook's contract.
syntax = "proto3";

package basalt.plugin.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/basaltdbhq/basaltdb/api/plugin/proto/basalt/plugin/v1;pluginv1";

service PluginService {
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

// initialize.schema.json #/$defs/request
message InitializeRequest {
  repeated string protocols = 1;
  repeated string hooks = 2;
  google.protobuf.Struct config = 3;
  Limits limits = 4;
}

// initialize.schema.json #/$defs/limits
message Limits {
  int64 max_message_bytes = 1;
  int32 max_in_flight = 2;
  int32 timeout_ms = 3;
}

// initialize.schema.json #/$defs/response
message InitializeResponse {
  string protocol = 1;
  string name = 2;
  string version = 3;
  // Keyed by hook name (wire.detect), as in the manifest.
  map<string, HookDeclaration> hooks = 4;
  Model model = 5;
}

// manifest.schema.json #/$defs/hookDeclaration
message HookDeclaration {
  string contract = 1;
  repeated string roles = 2;
  repeated string entity_types = 3;
}

// initialize.schema.json #/$defs/model
message Model {
  string name = 1;
  string version = 2;
}

// health.schema.json #/$defs/request
message HealthRequest {}

// health.schema.json #/$defs/response
message HealthResponse {
  // READY or NOT_READY.
  string status = 1;
}

// shutdown.schema.json #/$defs/request
message ShutdownRequest {}

// shutdown.schema.json #/$defs/response
message ShutdownResponse {}

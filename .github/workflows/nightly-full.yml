name: Nightly full-size tests

# make ci runs the exhaustive loops (the million-value dictionary, every
# NFKC and ignorable character, the false-positive tour) sampled or smaller,
# to stay fast. This job runs them at full size, with -race, once a night, so
# rare leak shapes and statistical drift still get found. A failure fails the
# scheduled run. Start it by hand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pii-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASALTDB_TEST_FULL: "1"
    steps:
      - uses: actions/checkout@v4
      # The toolchain line, its version check and the CI workflow's Go cache
      # (restored only).
      - uses: ./.github/actions/go
      # Add a package here when it starts to honour BASALTDB_TEST_FULL.
      - name: Full-size tests
        run: go test -race -count=1 -timeout 80m ./internal/pii/...

  # The classify CLI tests need a Postgres server (guardtest).
  classify-cli-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: basalt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASALTDB_TEST_FULL: "1"
      BASALTDB_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/basalt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
      - name: Full-size classify CLI tests
        run: go test -race -count=1 -timeout 30m -run 'TestClassify' ./cmd/basalt/

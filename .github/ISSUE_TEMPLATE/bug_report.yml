name: Bug report
description: Something in BasaltDB does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a credential, a connection string with a password, or real data. Use a throwaway database and redact anything private.
        For a security problem, do not open an issue. Follow SECURITY.md instead.
        If basalt crashed, ask your agent for the crash report link its status shows instead: it opens an issue with a scrubbed report for you.
        Not sure it is a bug? Ask in [Discussions](https://github.com/BasaltDBHq/BasaltDB/discussions/categories/q-a) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: basalt version
      description: The output of `basalt version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15 arm64, Ubuntu 24.04 amd64
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: Postgres version and host
      placeholder: Postgres 17 on Supabase, Postgres 16 in Docker
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent host
      description: The MCP client the agent runs in, if the bug involves an agent.
      placeholder: Claude Code 2.1, Codex, OpenCode
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error messages or logs. Remove credentials and real data first.
      render: text

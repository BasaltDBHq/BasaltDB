name: CI

# Pull requests, every push to master and a nightly run all take the same
# path: every job, the race detector on, every package. A failing run on master
# or the nightly one shows as a red run in the Actions tab.
on:
  push:
    branches: [master]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # The pull request path runs side by side: lint, vet, the script checks and
  # the test shards (each with its own Postgres). make ci runs all of it in
  # one go locally. The final job, check, is the one required status.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain line and the shared Go cache (.github/actions/go).
      # Setting GOTOOLCHAIN in the workflow would make setup-go use the go line.
      - uses: ./.github/actions/go
      - run: make lint

  vet:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: go
        uses: ./.github/actions/go
      - run: make vet shard-check
      # The one job that saves the Go cache, and only when no cache has this
      # exact key (a new toolchain or go.sum). It first compiles every test
      # binary with -race, without running them, so the test shards restore
      # what they build. A pull request's cache is its own; master's serves
      # every pull request.
      - name: compile the race test binaries
        if: steps.go.outputs.cache-hit != 'true'
        run: go test -race -count=1 -exec /bin/true ./... > /dev/null
      - if: steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.go.outputs.key }}
          path: ${{ steps.go.outputs.paths }}

  scripts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 22 or later: the portal page tests use Node's global WebSocket.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: make script-checks

  # Secret scan of the checked-out tree with the repo's .gitleaks.toml (default
  # rules; only test fixtures are allowlisted). The binary is pinned to one
  # version and checked against its published SHA-256 before it runs.
  secret-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: scan the tree
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir . --config .gitleaks.toml --redact --no-banner'

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Packages per shard: scripts/test-shards.txt. "rest" runs every
        # package no shard lists, so each package runs in exactly one shard.
        shard: ["1", "2", "3", rest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: basalt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASALTDB_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/basalt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      # 22 or later: the portal page tests use Node's global WebSocket.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: ./.github/actions/go
      # The trusted-path checks refuse a directory below one that group or
      # others can write, as /tmp is (mode 1777), so the tests' temp files go
      # below a directory only the runner's user can write.
      - name: tests
        run: |
          export TMPDIR="$HOME/.cache/basalt-tmp"
          mkdir -p "$TMPDIR"
          chmod 700 "$TMPDIR"
          make test-shard SHARD=${{ matrix.shard }} SHARD_JSON="$RUNNER_TEMP/test.json"
      - name: timings
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/test.json" ] || exit 0
          python3 - "$RUNNER_TEMP/test.json" <<'PY'
          import json,sys
          pk={};ts=[]
          for l in open(sys.argv[1]):
              e=json.loads(l)
              if e.get("Action") in("pass","fail"):
                  if e.get("Test"): ts.append((e["Elapsed"],e["Package"],e["Test"]))
                  else: pk[e["Package"]]=e["Elapsed"]
          for k,v in sorted(pk.items(),key=lambda x:-x[1]): print("PKG %7.1f %s"%(v,k))
          for v,p,t in sorted(ts,reverse=True)[:15]: print("TEST %7.1f %s %s"%(v,p,t))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/test.json

  # The one required status: fails if any job above failed or was skipped.
  check:
    if: always()
    needs: [lint, vet, scripts, secret-scan, test, containers, darwin-archives, macos-smoke]
    runs-on: ubuntu-latest
    steps:
      # Passes only when every job above succeeded. An allowlist, not a list of
      # bad results: a job GitHub gave up on before it started (for example a
      # macOS runner that never came) reports "abandoned", which a check for
      # failure, cancelled or skipped would let through.
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then
            echo 'Draft pull request: the CI jobs did not run. Mark it ready for review to run them.'
            exit 1
          fi
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo 'A required job did not succeed (failed, cancelled, skipped or abandoned).'
            exit 1
          fi

  # basalt engine --user in containers without systemd: the privilege drop as
  # root on every thread, then the compose example end to end (setup,
  # isolation, agent calls, restart, removal).
  containers:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: privilege drop as root in a container
        run: make test-privdrop
      - name: compose example
        run: make test-compose

  # Darwin/amd64 and darwin/arm64 are already in .goreleaser.yaml and on
  # v0.0.1-alpha. This job rebuilds those archives (CGO_ENABLED=0 snapshot,
  # no registry push) so macos-smoke runs the release tarball, not go build.
  darwin-archives:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip=publish --skip=homebrew --skip=announce --skip=sign
        env:
          BASALT_VERSION: snapshot
          RELEASE_KIND: snapshot
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Require darwin archives and checksums
        run: |
          set -euo pipefail
          test -f dist/basaltdb_0.0.0-nightly_darwin_amd64.tar.gz
          test -f dist/basaltdb_0.0.0-nightly_darwin_arm64.tar.gz
          test -f dist/SHA256SUMS
          grep -F 'basaltdb_0.0.0-nightly_darwin_amd64.tar.gz' dist/SHA256SUMS
          grep -F 'basaltdb_0.0.0-nightly_darwin_arm64.tar.gz' dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: basaltdb-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error

  macos-smoke:
    needs: darwin-archives
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      # The arm64 runner (macos-15) often waits 5 to 15 minutes for a machine,
      # which alone breaks the 7-minute pull request budget. Pull requests run
      # the Intel smoke only; pushes to master, the nightly run and manual runs
      # run both. The darwin/arm64 archive is still built and checksummed on
      # every pull request (darwin-archives).
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"runner":"macos-15-intel","expect_uname":"x86_64","archive":"basaltdb_0.0.0-nightly_darwin_amd64.tar.gz"}]' || '[{"runner":"macos-15","expect_uname":"arm64","archive":"basaltdb_0.0.0-nightly_darwin_arm64.tar.gz"},{"runner":"macos-15-intel","expect_uname":"x86_64","archive":"basaltdb_0.0.0-nightly_darwin_amd64.tar.gz"}]') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: basaltdb-snapshot
          path: dist
      - name: Verify runner arch, checksum, and archive
        run: |
          set -euo pipefail
          got=$(uname -m)
          echo "runner=${{ matrix.runner }} uname-m=${got} expect=${{ matrix.expect_uname }}"
          test "$got" = "${{ matrix.expect_uname }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            grep " ${{ matrix.archive }}$" SHA256SUMS | sha256sum -c -
          else
            grep " ${{ matrix.archive }}$" SHA256SUMS | shasum -a 256 -c -
          fi
          mkdir extract
          tar -xzf "${{ matrix.archive }}" -C extract
          test -x extract/basalt
          file extract/basalt
      - name: Smoke release binaries
        env:
          EXPECT_UNAME: ${{ matrix.expect_uname }}
        run: sh scripts/release-archive-smoke.sh dist/extract

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# One binary, basalt. All release binaries are CGO_ENABLED=0 static builds.
# Reproducible builds: every timestamp that lands in an artifact (binary
# mtime, archive entries, package entries) is the commit time of the commit
# being built, not the time the build ran. With -trimpath, the same commit
# and Go toolchain give the same bytes and the same SHA256SUMS on any machine.
# SOURCE_DATE_EPOCH is set to the same commit time for the builds.
# Version tags are created manually (see docs/RELEASING.md). CI never
# creates or pushes git tags. Branch/PR builds use --snapshot (no GitHub
# Release, no registry publish).
project_name: basaltdb

builds:
  - id: basalt
    main: ./cmd/basalt
    binary: basalt
    env:
      - CGO_ENABLED=0
      - SOURCE_DATE_EPOCH={{ .CommitTimestamp }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/basaltdbhq/basaltdb/internal/lib/buildinfo.Version={{.Env.BASALT_VERSION}}

archives:
  - formats: [tar.gz]
    # Flat archives so install.sh can copy binaries from the extract root.
    wrap_in_directory: false
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Fixed owner and time so the archive bytes do not depend on who built it.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

nfpms:
  - id: linux-packages
    ids: [basalt]
    package_name: basaltdb
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    maintainer: Iman Tumorang <iman@tumorang.com>
    description: |-
      The action ledger for AI agents on your Postgres. Not a database.
      Open source under Apache-2.0.
    license: Apache-2.0
    formats: [deb, rpm, apk]
    mtime: "{{ .CommitDate }}"
    bindir: /usr/bin
    section: database
    contents:
      - src: LICENSE
        dst: /usr/share/doc/basaltdb/LICENSE
        file_info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/basaltdb/README.md
        file_info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  # portal.sha256 is attached to the release (release.extra_files below), so
  # SHA256SUMS lists it too and its signature covers every release file.
  extra_files:
    - glob: web/portal.sha256
      name_template: portal.sha256

# Keyless Sigstore signature of SHA256SUMS, and through it of every archive,
# package and portal.sha256. cosign signs with a short-lived certificate
# issued to the release workflow's GitHub OIDC identity and records it in the
# public Rekor transparency log; there is no signing key to keep or leak.
# The bundle (certificate, signature and log entry) is attached to the
# release as SHA256SUMS.sigstore.json. Snapshot builds pass --skip=sign.
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      # A Sigstore bundle (the .sigstore.json format) also on cosign 2.x.
      - "--new-bundle-format"
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    output: true

# GoReleaser never writes notes from git. A stable tag passes the notes of its
# CHANGELOG.md section with --release-notes (scripts/release-notes.sh), which
# GoReleaser reads only while the changelog is on, so it is on only then.
# Release candidates publish with a fixed body and no GoReleaser publish.
changelog:
  disable: '{{ ne (envOrDefault "RELEASE_KIND" "") "tag" }}'

# Snapshot archive names (CI Actions artifacts only). CI never tags
# and never publishes these to GitHub Releases.
snapshot:
  version_template: "0.0.0-nightly"

# The cask is uploaded only on stable v* tags (RELEASE_KIND "tag"; never
# "rc" or "snapshot") and only when PUBLISH_HOMEBREW is
# "true" (the release workflow sets it from the repository variable of the same
# name, default off). Unset or anything else means no upload and no tap token
# needed. Default tap is BasaltDBHq/homebrew-tap (install: brew install basaltdbhq/tap/basaltdb).
# A cask, not a formula: GoReleaser deprecated `brews` in favour of
# `homebrew_casks`. The tap's tap_migrations.json moves installs of the old
# formula to this cask on the next brew upgrade.
homebrew_casks:
  - name: basaltdb
    binaries: [basalt]
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    # brew style refuses a description that starts with an article.
    description: Action ledger for AI agents on your Postgres
    repository:
      owner: '{{ or (envOrDefault "HOMEBREW_TAP_OWNER" "") "BasaltDBHq" }}'
      name: '{{ or (envOrDefault "HOMEBREW_TAP_NAME" "") "homebrew-tap" }}'
      # The token field accepts only a single {{ .Env.NAME }}, no functions.
      # The release workflow always sets the variable, empty when Homebrew is off.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # basalt is not notarized, so Gatekeeper would block the first run of a
    # downloaded binary. The release's signature is the cosign bundle on
    # SHA256SUMS, and Homebrew checks the archive against the cask's sha256.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/basalt"]
          end
    skip_upload: '{{ or (ne (envOrDefault "RELEASE_KIND" "") "tag") (ne (envOrDefault "PUBLISH_HOMEBREW" "") "true") }}'

release:
  name_template: "{{ .Tag }}"
  # Semver prerelease suffix (-alpha / -beta) → GitHub prerelease. Release
  # candidates (-rc.N) are published as prereleases by the release workflow.
  prerelease: auto
  mode: replace
  # The portal manifest the release's pages were built from, so anyone can
  # check the hosted portal against it (make portal-verify).
  extra_files:
    - glob: web/portal.sha256
      name_template: portal.sha256
